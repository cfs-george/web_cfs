# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  schedule:
    # Daily at 04:23 UTC; deploys a freshly generated sitemap.
    - cron: "23 4 * * *"

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate SEO metadata
        run: node scripts/generate-headmeta.mjs
      - name: Validate SEO metadata
        run: node --test scripts/headmeta.test.mjs
      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  maintenance:
    # A real maintenance record also keeps the daily schedule active during quiet periods.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate sitemap generation
        run: node scripts/generate-sitemap.mjs
      - name: Record maintenance after 50 days without a commit
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - last_commit < 50 * 24 * 60 * 60 )); then
            echo "Recent repository activity; no maintenance commit needed."
            exit 0
          fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(".github/maintenance.json", JSON.stringify({
              checkedAt: new Date().toISOString(),
              check: "Sitemap generation passed after a successful Pages deployment"
            }, null, 2) + "\n");
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/maintenance.json
          git commit -m "chore: record scheduled sitemap maintenance"
          # Never force-push: concurrent updates or branch protections must be respected.
          git push origin HEAD:master
